name: Yamabiko iOS release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: yamabiko-ios-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm64-simulator]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/materialize
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install setuptools
      - name: Build cold from verified source
        run: NODEJS_MOBILE_FLAVOR=full ./tools/ios_framework_prepare.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: node-ios-${{ matrix.arch }}-full
          path: out_ios_${{ matrix.arch }}
  combine:
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/materialize
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install setuptools
      - uses: actions/download-artifact@v8
        with:
          pattern: node-ios-*-full
          merge-multiple: true
          path: out_ios
      - name: Combine and package headers and licenses
        run: |
          ./configure
          ./tools/ios_framework_prepare.sh combine_frameworks
          ./tools/copy_libnode_headers.sh ios
          mkdir -p artifacts/include
          cp -R out_ios/NodeMobile.xcframework artifacts/
          cp -R out_ios/libnode/include/* artifacts/include/
          cp LICENSE artifacts/LICENSE
          printf 'Recipe: %s\nSource tree: %s\n' '${{ github.sha }}' "$(git rev-parse 'HEAD^{tree}')" > artifacts/PROVENANCE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: nodejs-mobile-ios
          path: artifacts
  simulator-tests:
    needs: combine
    uses: ./.github/workflows/ios-simulator-tests.yml
    with:
      build_run_id: '${{ github.run_id }}'
      flavors: '["full"]'
  publish:
    needs: simulator-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: nodejs-mobile-ios
          path: artifacts
      - name: Publish iOS-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^v//p' upstream-base.txt | head -1)
          TAG="yamabiko-v${VERSION}-0"
          ARCHIVE="nodejs-mobile-ios-${VERSION}-yamabiko.0.zip"
          (cd artifacts && zip -qr "../$ARCHIVE" .)
          sha256sum "$ARCHIVE" > SHA256SUMS
          cat > release-notes.txt <<EOF
          YamabikoChat iOS-only NodeMobile build from Node.js ${VERSION}.
          Recipe commit: ${{ github.sha }}
          Build and simulator test run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Cold-built full flavor, arm64 device and simulator; curated upstream JS suite and N-API addon tested on iOS Simulator.
          Android and physical-device testing are not included in this fork's release gate.
          See PROVENANCE.txt inside the archive for the verified source tree.
          EOF
          gh release create "$TAG" "$ARCHIVE" SHA256SUMS --target '${{ github.sha }}' --prerelease --title "Yamabiko NodeMobile ${VERSION}" --notes-file release-notes.txt
